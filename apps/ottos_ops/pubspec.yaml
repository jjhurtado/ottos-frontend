name: ottos_ops
description: Ottos operations panel (web) for administrators and sales staff.
publish_to: none
version: 1.0.0-rc.2+3
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  intl: ^0.20.3
  ottos_core:
    path: ../../packages/ottos_core
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Bundled so the web panel does not download Roboto from fonts.gstatic.com,
  # which may be blocked from Cuba. From the Flutter SDK (Apache 2.0, license
  # next to the files).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
