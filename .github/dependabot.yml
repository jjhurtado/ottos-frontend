# Monthly update checks for the Dart packages and the pinned GitHub Actions (REQ-005, SEC-7), one grouped
# pull request per ecosystem so a month's updates ship in one batch. Security updates are not grouped:
# they open their own pull request as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      pub:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
