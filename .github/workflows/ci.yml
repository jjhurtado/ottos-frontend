# Checks every pull request and every push to develop and main (REQ-005):
# format, static analysis and unit and widget tests of the three packages.
# Integration tests need a running backend and are left out.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA; the comment keeps the tag for updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          # No cache: flutter-action caches with actions/cache by tag, which the
          # repository's SHA-pinning rule blocks.
          cache: false

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check format
        run: dart format --output=none --set-exit-if-changed packages apps

      - name: Analyze
        run: |
          for p in packages/ottos_core apps/ottos_ops apps/ottos_courier; do
            (cd "$p" && flutter analyze)
          done

      - name: Test
        run: |
          for p in packages/ottos_core apps/ottos_ops apps/ottos_courier; do
            (cd "$p" && flutter test --exclude-tags integration)
          done
