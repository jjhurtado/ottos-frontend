# Checks every pull request and every push to develop and main (REQ-005):
# format, static analysis and unit and widget tests of the three packages.
# Integration tests need a running backend and are left out.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA; the comment keeps the tag for updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Flutter installed by hand, checked against the published sha256 (same as
      # apps/ottos_ops/Dockerfile). subosito/flutter-action uses actions/cache by
      # tag, which the repository's SHA-pinning rule blocks.
      - name: Install Flutter 3.47.7
        env:
          FLUTTER_VERSION: 3.47.7
          FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics >/dev/null

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check format
        run: dart format --output=none --set-exit-if-changed packages apps

      - name: Analyze
        run: |
          for p in packages/ottos_core apps/ottos_ops apps/ottos_courier; do
            (cd "$p" && flutter analyze)
          done

      - name: Test
        run: |
          for p in packages/ottos_core apps/ottos_ops apps/ottos_courier; do
            (cd "$p" && flutter test --exclude-tags integration)
          done
