name: ottos_core
description: Shared code for the Ottos apps - API client, authentication, models, theme and widgets.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: ">=3.35.0"

dependencies:
  bloc: ^9.2.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  assets:
    - assets/brand/
